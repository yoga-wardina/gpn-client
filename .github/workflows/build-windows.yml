name: Build Windows exe

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Build exe
        run: bun run build:win

      - name: Bundle portable zip (exe + assets)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/GPNClient | Out-Null
          Copy-Item dist/GPNClient.exe dist/GPNClient/
          Copy-Item -Recurse assets dist/GPNClient/assets
          Compress-Archive -Path dist/GPNClient/* -DestinationPath dist/GPNClient-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPNClient-windows
          path: dist/GPNClient-windows.zip
